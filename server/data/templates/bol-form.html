<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แบบฟอร์มใบนำส่ง (BOL)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f2efe8;
    font-family: 'Sarabun', 'Noto Sans Thai', 'Tahoma', sans-serif;
    color: #1a1a1a;
    padding: 24px 12px 60px;
  }
  /* แถบเครื่องมือ — ซ่อนเมื่อพิมพ์ */
  .toolbar {
    max-width: 800px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .toolbar button {
    border: none;
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-print { background: #b67709; color: #fff; }
  .btn-print:hover { background: #9a6406; }
  .btn-add { background: #fff; color: #5b4a2a; border: 1px solid #d8cdb4; }
  .hint { color: #8a7f66; font-size: 12.5px; }

  /* เอกสาร A4 */
  .sheet {
    max-width: 800px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #ddd5c2;
    border-radius: 10px;
    padding: 34px 38px;
    font-size: 14px;
    line-height: 1.7;
    box-shadow: 0 6px 24px rgba(90, 74, 40, 0.08);
  }
  .head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    border-bottom: 2px solid #1a1a1a;
    padding-bottom: 14px;
    margin-bottom: 20px;
  }
  .org { font-family: 'Noto Serif Thai', 'TH Sarabun New', serif; font-size: 20px; font-weight: 700; }
  .title { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; margin-top: 2px; }
  .no { text-align: right; }
  .no .sub { color: #6b7280; font-size: 12.5px; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .sec {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: #6b7280; margin: 10px 0 6px;
  }
  .row { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; border-bottom: 1px solid #ece8dd; }
  .row label { width: 108px; flex: none; color: #6b7280; font-size: 12.5px; }
  .route {
    margin: 16px 0; padding: 12px 14px; background: #f7f7f5; border-radius: 8px;
  }
  .route .row { border-bottom: none; }
  .route label { width: 74px; }
  .row2 { display: flex; align-items: baseline; gap: 10px; padding: 4px 0; border-bottom: 1px solid #ece8dd; }
  .row2 label { width: 84px; flex: none; color: #6b7280; font-size: 12.5px; }
  .row2 .arrow { color: #6b7280; padding: 0 4px; }

  table.goods { width: 100%; border-collapse: collapse; margin: 6px 0 14px; }
  table.goods th {
    background: #f3f1ea; color: #374151; font-size: 12px; text-align: left;
    text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 10px;
    border: 1px solid #e0d9c6;
  }
  table.goods td { border: 1px solid #e0d9c6; padding: 4px 8px; }
  table.goods td.del { width: 30px; text-align: center; }
  .del-btn {
    border: none; background: none; color: #b45309; font-size: 15px;
    cursor: pointer; padding: 2px 6px; border-radius: 6px;
  }
  .del-btn:hover { background: #fdeee3; }

  .notes { margin: 4px 0 20px; }
  .notes label { color: #6b7280; font-size: 12.5px; margin-right: 8px; }

  .sign { display: flex; justify-content: space-between; gap: 40px; margin-top: 46px; }
  .sign > div { flex: 1; text-align: center; }
  .line { border-bottom: 1px solid #1a1a1a; height: 40px; }
  .lab { font-size: 12px; color: #374151; }

  /* ช่องกรอก — เส้นใต้บาง ๆ เวลากรอก */
  input {
    border: none; border-bottom: 1px dashed #b9ad90; background: transparent;
    font-family: inherit; font-size: 14px; color: #1a1a1a; padding: 2px 4px;
    min-width: 120px; flex: 1;
  }
  input:focus { outline: none; border-bottom-color: #b67709; }
  input.big { font-size: 18px; font-weight: 700; min-width: 220px; }
  table.goods input { min-width: 90px; width: 100%; }
  input.wide { width: 100%; }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .sheet { box-shadow: none; border: none; border-radius: 0; max-width: 100%; padding: 8px; }
    input { border-bottom-color: #c9c2ae; }
    .head { border-bottom-color: #000; }
    .line { border-bottom-color: #000; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button class="btn-print" onclick="window.print()">🖨 พิมพ์ใบนำส่ง</button>
    <button class="btn-add" onclick="addGoodsRow()">＋ เพิ่มแถวสินค้า</button>
    <span class="hint">เปิดไฟล์นี้โดยตรง (ไม่ต้องรัน server) — กรอกข้อมูลแล้วกดพิมพ์ หรือพิมพ์เป็น PDF ได้เลย</span>
  </div>

  <div class="sheet">
    <div class="head">
      <div>
        <div class="org"><input class="big" value="บริษัท ขนส่ง จำกัด" aria-label="ชื่อองค์กร"></div>
        <div class="title">ใบนำส่งสินค้า (BOL)</div>
      </div>
      <div class="no">
        <div>เลขที่ <input value="BOL-____-____" aria-label="เลขที่ใบนำส่ง" style="min-width:150px"></div>
        <div class="sub">วันที่ <input type="date" aria-label="วันที่ออกเอกสาร"></div>
      </div>
    </div>

    <div class="cols">
      <div>
        <div class="sec">ผู้รับ / ลูกค้า</div>
        <div class="row"><label>ชื่อลูกค้า</label><input aria-label="ชื่อลูกค้า"></div>
        <div class="row"><label>ที่อยู่</label><input aria-label="ที่อยู่"></div>
        <div class="row"><label>ผู้ติดต่อ</label><input aria-label="ผู้ติดต่อ"></div>
        <div class="row"><label>โทรศัพท์</label><input aria-label="โทรศัพท์"></div>
        <div class="row"><label>เลขผู้เสียภาษี</label><input aria-label="เลขผู้เสียภาษี"></div>
      </div>
      <div>
        <div class="sec">รถบรรทุก / พนักงานขับ</div>
        <div class="row"><label>ทะเบียนรถ</label><input aria-label="ทะเบียนรถ"></div>
        <div class="row"><label>ประเภทรถ</label><input aria-label="ประเภทรถ" placeholder="หกล้อ / สิบล้อ / ห้องเย็น"></div>
        <div class="row"><label>พนักงานขับ</label><input aria-label="พนักงานขับ"></div>
        <div class="row"><label>โทรศัพท์คนขับ</label><input aria-label="โทรศัพท์คนขับ"></div>
        <div class="row"><label>เลขที่เที่ยว</label><input aria-label="เลขที่เที่ยว"></div>
      </div>
    </div>

    <div class="route">
      <div class="sec">เส้นทางขนส่ง</div>
      <div class="row2">
        <label>ต้นทาง</label><input aria-label="ต้นทาง"><span class="arrow">→</span>
        <label>ปลายทาง</label><input aria-label="ปลายทาง">
      </div>
      <div class="row2">
        <label>ระยะทาง</label><input aria-label="ระยะทาง" placeholder="กม." style="min-width:90px">
        <label>กำหนดส่ง</label><input type="date" aria-label="กำหนดส่ง">
      </div>
    </div>

    <table class="goods" id="goods">
      <thead>
        <tr><th>รายละเอียดสินค้า</th><th style="width:120px">น้ำหนัก</th><th style="width:130px">ค่าขนส่ง</th><th class="del"></th></tr>
      </thead>
      <tbody id="goodsBody">
        <tr>
          <td><input aria-label="รายละเอียดสินค้า"></td>
          <td><input aria-label="น้ำหนัก" placeholder="กก."></td>
          <td><input aria-label="ค่าขนส่ง" placeholder="บาท"></td>
          <td class="del"></td>
        </tr>
      </tbody>
    </table>

    <div class="notes">
      <label>หมายเหตุ</label><input class="wide" aria-label="หมายเหตุ">
    </div>

    <div class="sign">
      <div><div class="line"></div><div class="lab">ลายเซ็นผู้ส่ง</div></div>
      <div><div class="line"></div><div class="lab">ลายเซ็นผู้รับ</div></div>
    </div>
  </div>

<script>
  function addGoodsRow() {
    const tbody = document.getElementById('goodsBody');
    const row = tbody.querySelector('tr').cloneNode(true);
    row.querySelectorAll('input').forEach((i) => { i.value = ''; });
    const del = row.querySelector('.del');
    del.innerHTML = '<button type="button" class="del-btn" title="ลบแถว" aria-label="ลบแถว">✕</button>';
    del.querySelector('button').addEventListener('click', () => {
      if (tbody.querySelectorAll('tr').length > 1) row.remove();
    });
    tbody.appendChild(row);
    row.querySelector('input').focus();
  }
</script>
</body>
</html>
