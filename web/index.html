<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ระบบบริหารจัดการขนส่ง (Transport Management System) - จัดการออเดอร์ รถ พนักงานขับ และรายงาน" />
    <meta name="theme-color" content="#faf9fd" />
    <script>
      /* ทาธีมก่อนเบราว์เซอร์วาดเฟรมแรก — ถ้ารอ React จะเห็นจอขาวแวบหนึ่งก่อนเป็นสีเข้ม */
      (function () {
        try {
          var t = localStorage.getItem('tms-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
          if (t === 'dark') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#14111f')
          }
        } catch (e) {
          /* localStorage ถูกปิด — ใช้โหมดสว่างตามค่า default ของ CSS */
        }
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TMS" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
