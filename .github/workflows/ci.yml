name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Typecheck · Tests (incl. a11y) · Build · WCAG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 ไม่ใช่ 20 — jsdom ที่เทส a11y ใช้ ดึง undici รุ่นที่เรียก
          # webidl.util.markAsUncloneable ซึ่งยังไม่มีใน Node 20 worker ของ vitest
          # เลยตายตั้งแต่ยังไม่ทันรันเทส (เครื่อง dev รัน 24 จึงไม่เจอ)
          node-version: 22
          cache: npm

      - name: ติดตั้ง dependencies
        run: npm ci

      - name: Typecheck (server + web)
        run: npm run typecheck

      - name: Unit tests (server) + axe-core a11y (web)
        run: npm test

      - name: Build production
        run: npm run build

      - name: WCAG AA audit (คอนทราสต์ทุกคู่สี)
        run: node web/scripts/contrast.mjs
